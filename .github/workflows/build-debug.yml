name: Debug Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Debug / ${{ matrix.channel }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: Latest
            dalamud-url: https://goatcorp.github.io/dalamud-distrib/latest.zip
          - channel: Staging
            dalamud-url: https://goatcorp.github.io/dalamud-distrib/stg/latest.zip

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Download and extract Dalamud (${{ matrix.channel }})
        env:
          DALAMUD_URL: ${{ matrix.dalamud-url }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          $dalamud = Join-Path $env:APPDATA 'XIVLauncher/addon/Hooks/dev'
          Invoke-WebRequest -Uri $env:DALAMUD_URL -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamud

      - name: Build Debug x64
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build ZeffLens.sln -c Debug -p:Platform=x64

      - uses: actions/upload-artifact@v4
        with:
          name: ZeffLens-debug-${{ matrix.channel }}-${{ github.sha }}
          path: ZeffLens/ZeffLens/bin/x64/Debug/
          if-no-files-found: error
